<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Cancelled | TENBJJ</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/jpeg" href="/assets/images/logo.jpg" />
  <link rel="stylesheet" href="/css/style.css" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LNB2J9VBPS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-LNB2J9VBPS');
  </script>
  <style>
    .cancel-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 24px;
      background: #080808;
    }
    .cancel-icon { font-size: 3rem; margin-bottom: 24px; display: block; }
    .cancel-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1.4rem, 4vw, 2rem);
      color: rgba(255,255,255,0.85);
      margin-bottom: 16px;
      letter-spacing: 0.05em;
    }
    .cancel-body {
      font-family: 'Raleway', sans-serif;
      font-size: 1rem;
      color: rgba(255,255,255,0.5);
      line-height: 1.75;
      max-width: 460px;
      margin: 0 auto 40px;
    }
    .cancel-rule { width: 60px; height: 2px; background: #8B0000; margin: 0 auto 32px; }
    .btn-back {
      display: inline-block;
      font-family: 'Raleway', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #C5A028;
      border: 1.5px solid #C5A028;
      padding: 14px 36px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-back:hover { background: #C5A028; color: #080808; }
  </style>
</head>
<body>
  <nav class="nav" id="nav">
    <a class="nav-logo" href="/">
      <img src="/assets/images/logo.jpg" alt="TENBJJ Logo" />
      <span class="nav-logo-text">TENBJJ</span>
    </a>
  </nav>

  <div class="cancel-wrap">
    <span class="cancel-icon">👊</span>
    <h1 class="cancel-title">No worries.</h1>
    <div class="cancel-rule"></div>
    <p class="cancel-body">
      Your order was cancelled and nothing was charged. 
      Head back to the shop whenever you're ready.
    </p>
    <a href="/#shop" class="btn-back">Back to Shop</a>
  </div>
</body>
</html>
